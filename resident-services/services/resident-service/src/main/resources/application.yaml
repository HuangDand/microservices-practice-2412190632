server:
  port: 8081

spring:
  application:
    name: resident-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3311/resident_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:resident_user}
    password: ${DB_PASSWORD:resident-pass-123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
