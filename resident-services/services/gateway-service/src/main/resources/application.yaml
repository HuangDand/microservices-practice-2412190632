server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
    # Gateway 5.0.0 起配置前缀下沉为 spring.cloud.gateway.server.webflux
    gateway:
      server:
        webflux:
          routes:
            # === 放行路径 ===
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              metadata:
                auth: permitAll

            # === 报修：写操作需管理员（order 更小，优先匹配） ===
            - id: repair-admin-write
              uri: lb://repair-service
              order: 0
              predicates:
                - Path=/api/repair-tickets/**
                - Method=POST,PATCH,DELETE
              metadata:
                requiredRole: ROLE_ADMIN

            - id: repair-route
              uri: lb://repair-service
              order: 10
              predicates:
                - Path=/api/repair-tickets/**

            # === 业主：写操作需管理员 ===
            - id: resident-admin-write
              uri: lb://resident-service
              order: 0
              predicates:
                - Path=/api/residents/**
                - Method=POST,PATCH,DELETE
              metadata:
                requiredRole: ROLE_ADMIN

            - id: resident-route
              uri: lb://resident-service
              order: 10
              predicates:
                - Path=/api/residents/**

            # === 公告：写操作需管理员 ===
            - id: notice-admin-write
              uri: lb://notice-service
              order: 0
              predicates:
                - Path=/api/notices/**
                - Method=POST,PATCH,DELETE
              metadata:
                requiredRole: ROLE_ADMIN

            - id: notice-route
              uri: lb://notice-service
              order: 10
              predicates:
                - Path=/api/notices/**

  main:
    web-application-type: reactive

# JWT 密钥必须来自环境变量，禁止硬编码真实值
auth:
  jwt:
    secret: ${JWT_SECRET:changeme-please-set-in-env}
    issuer: resident-services-gw
    header: Authorization
    prefix: "Bearer "

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.zjgsu.hwy.gateway: DEBUG
