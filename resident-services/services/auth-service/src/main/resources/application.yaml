server:
  port: 8084

spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3314/auth_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth-pass-123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

# JWT 密钥必须来自环境变量，禁止硬编码真实值
auth:
  jwt:
    secret: ${JWT_SECRET:changeme-please-set-in-env}
    issuer: resident-services-gw
    expiration-minutes: 120
  # 预置账号（仅首次启动时写入，重复启动会被 idempotent upsert）
  bootstrap:
    admin-username: admin
    admin-password: admin123
    resident-username: resident1
    resident-password: resident123

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.zjgsu.hwy.auth: DEBUG
