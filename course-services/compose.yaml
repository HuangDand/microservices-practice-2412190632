services:
  user-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_db
      MYSQL_USER: course
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - course-network
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -u course -p${MYSQL_PASSWORD} -D user_db -e \"SELECT 1;\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  catalog-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: catalog_db
      MYSQL_USER: course
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - catalog-db-data:/var/lib/mysql
    networks:
      - course-network
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -u course -p${MYSQL_PASSWORD} -D catalog_db -e \"SELECT 1;\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  enrollment-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: enrollment_db
      MYSQL_USER: course
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - enrollment-db-data:/var/lib/mysql
    networks:
      - course-network
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -u course -p${MYSQL_PASSWORD} -D enrollment_db -e \"SELECT 1;\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set in .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set in .env}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - course-network

  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: user-service
      DB_URL: jdbc:mysql://user-db:3306/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: course
      DB_PASSWORD: ${MYSQL_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set in .env}
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - course-network

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: catalog-service
      DB_URL: jdbc:mysql://catalog-db:3306/catalog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: course
      DB_PASSWORD: ${MYSQL_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set in .env}
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - course-network

  enrollment-service:
    build: ./services/enrollment-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: enrollment-service
      DB_URL: jdbc:mysql://enrollment-db:3306/enrollment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: course
      DB_PASSWORD: ${MYSQL_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set in .env}
    depends_on:
      user-db:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
      enrollment-db:
        condition: service_healthy
      user-service:
        condition: service_started
      catalog-service:
        condition: service_started
    networks:
      - course-network

networks:
  course-network:

volumes:
  user-db-data:
  catalog-db-data:
  enrollment-db-data:
  nacos-data:
