
services:
  mysql:   # ✅ 这里！mysql 必须缩进在 services: 下面！
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: course
      MYSQL_USER: course
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - course-network
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -u course -p${MYSQL_PASSWORD} -D course -e \"SELECT 1;\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/course?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: course
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - course-network

networks:
  course-network:
volumes:
  mysql-data:
