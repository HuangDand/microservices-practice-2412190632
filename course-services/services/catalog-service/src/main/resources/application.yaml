server:
  port: 8082

spring:
  application:
    name: catalog-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: COURSE_GROUP
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/catalog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:course}
    password: ${DB_PASSWORD:123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
