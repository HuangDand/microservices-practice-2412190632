# 本地编排：Nacos 注册中心 + 3 个微服务 + 3 个独立 MySQL
# 容器之间通过 Compose 服务名（DNS）通信；业务调用通过 Nacos 服务名发现实例。
# 宿主机端口映射仅用于本机浏览控制台/IDE 调试。
name: resident-services

services:
  # ---------- Nacos 注册中心 ----------
  nacos:
    image: nacos/nacos-server:v3.2.4
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请在 .env 中设置 NACOS_AUTH_TOKEN（Base64）}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请在 .env 中设置 NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请在 .env 中设置 NACOS_AUTH_IDENTITY_VALUE}
    ports:
      - "18081:8080"         # 控制台（本机 18080 已被其他工程占用）
      - "18848:8848"         # 服务端 OpenAPI（宿主机调试）
      - "19848:9848"         # SDK gRPC 通信（宿主机调试）
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - community-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  # ---------- 业主服务数据库 ----------
  resident-db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: resident_db
      MYSQL_USER: resident_user
      MYSQL_PASSWORD: ${RESIDENT_DB_PASSWORD:-resident-pass-123}
      MYSQL_ROOT_PASSWORD: ${RESIDENT_DB_ROOT_PASSWORD:-resident-root-123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3311:3306"          # 仅宿主机调试用
    volumes:
      - resident-db-data:/var/lib/mysql
    networks:
      - community-net
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u$${MYSQL_USER} --password=$${MYSQL_PASSWORD} -D $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------- 报修服务数据库 ----------
  repair-db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: repair_db
      MYSQL_USER: repair_user
      MYSQL_PASSWORD: ${REPAIR_DB_PASSWORD:-repair-pass-123}
      MYSQL_ROOT_PASSWORD: ${REPAIR_DB_ROOT_PASSWORD:-repair-root-123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3312:3306"          # 仅宿主机调试用
    volumes:
      - repair-db-data:/var/lib/mysql
    networks:
      - community-net
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u$${MYSQL_USER} --password=$${MYSQL_PASSWORD} -D $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------- 公告服务数据库 ----------
  notice-db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notice_db
      MYSQL_USER: notice_user
      MYSQL_PASSWORD: ${NOTICE_DB_PASSWORD:-notice-pass-123}
      MYSQL_ROOT_PASSWORD: ${NOTICE_DB_ROOT_PASSWORD:-notice-root-123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3313:3306"          # 仅宿主机调试用
    volumes:
      - notice-db-data:/var/lib/mysql
    networks:
      - community-net
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u$${MYSQL_USER} --password=$${MYSQL_PASSWORD} -D $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------- 业主服务 ----------
  resident-service:
    build: ./services/resident-service
    restart: unless-stopped
    ports:
      - "8091:8081"          # 仅宿主机调试用
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: resident-service
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请在 .env 中设置 NACOS_PASSWORD}
      NACOS_GROUP: PERSONAL_GROUP
      DB_URL: jdbc:mysql://resident-db:3306/resident_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: resident_user
      DB_PASSWORD: ${RESIDENT_DB_PASSWORD:-resident-pass-123}
    depends_on:
      resident-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - community-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  # ---------- 报修服务（通过 Nacos 服务名发现业主服务） ----------
  repair-service:
    build: ./services/repair-service
    restart: unless-stopped
    ports:
      - "8092:8082"          # 仅宿主机调试用
    environment:
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: repair-service
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请在 .env 中设置 NACOS_PASSWORD}
      NACOS_GROUP: PERSONAL_GROUP
      DB_URL: jdbc:mysql://repair-db:3306/repair_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: repair_user
      DB_PASSWORD: ${REPAIR_DB_PASSWORD:-repair-pass-123}
    depends_on:
      repair-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - community-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  # ---------- 公告服务 ----------
  notice-service:
    build: ./services/notice-service
    restart: unless-stopped
    ports:
      - "8093:8083"          # 仅宿主机调试用
    environment:
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: notice-service
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请在 .env 中设置 NACOS_PASSWORD}
      NACOS_GROUP: PERSONAL_GROUP
      DB_URL: jdbc:mysql://notice-db:3306/notice_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: notice_user
      DB_PASSWORD: ${NOTICE_DB_PASSWORD:-notice-pass-123}
    depends_on:
      notice-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - community-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

networks:
  community-net:
    driver: bridge

volumes:
  nacos-data:
  resident-db-data:
  repair-db-data:
  notice-db-data:
